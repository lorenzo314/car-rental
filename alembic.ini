# Alembic configuration file.
# The SQLAlchemy URL is overridden in db/migrations/env.py
# by reading from app/config.py (which reads from .env).
# The value below is a placeholder and is never used directly.

[alembic]
script_location = db/migrations
prepend_sys_path = .
version_path_separator = os

# Placeholder — overridden in env.py
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
